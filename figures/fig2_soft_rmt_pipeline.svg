<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Soft-RMT packet-processing flow</title>
  <desc id="desc">An N6 packet enters a parser FSM, supported TLS application-data packets populate the PHV and traverse four sequential match-action stages, while unsupported traffic follows a bypass or default policy path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#263238"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8790"/>
    </marker>
    <style>
      .page { fill:#ffffff; }
      .title { font-family:Arial, Helvetica, sans-serif; font-size:29px; font-weight:700; fill:#17212b; }
      .section { font-family:Arial, Helvetica, sans-serif; font-size:19px; font-weight:700; fill:#17212b; }
      .label { font-family:Arial, Helvetica, sans-serif; font-size:16px; font-weight:600; fill:#17212b; }
      .small { font-family:Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; fill:#36434d; }
      .tiny { font-family:Arial, Helvetica, sans-serif; font-size:12px; font-weight:400; fill:#45535e; }
      .box { stroke:#53636e; stroke-width:2; rx:10; ry:10; }
      .parser { fill:#e8f1f8; stroke:#3976a8; }
      .phv { fill:#f4f7fa; stroke:#5c7180; }
      .stage { fill:#e9f5ee; stroke:#37845a; stroke-width:2; rx:9; ry:9; }
      .bypass { fill:#f4f5f6; stroke:#7d8790; stroke-width:2; stroke-dasharray:9 7; rx:9; ry:9; }
      .inset { fill:#fff2df; stroke:#c77b23; stroke-width:2; rx:10; ry:10; }
      .note { fill:#f8fafb; stroke:#b6c0c7; stroke-width:1.4; rx:8; ry:8; }
      .arrow { stroke:#263238; stroke-width:2.5; fill:none; }
      .gray-arrow { stroke:#7d8790; stroke-width:2.2; fill:none; stroke-dasharray:8 7; }
      .head-dark { fill:#263238; }
      .head-gray { fill:#7d8790; }
      .divider { stroke:#b7c0c6; stroke-width:1.2; }
      .diamond { fill:#ffffff; stroke:#3976a8; stroke-width:1.8; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="1050"/>
  <text class="title" x="50" y="43">Fig. 2  Soft-RMT packet-processing flow</text>
  <line class="divider" x1="50" y1="60" x2="1750" y2="60"/>
  <rect x="1315" y="20" width="16" height="16" fill="#e9f5ee" stroke="#37845a"/>
  <text class="tiny" x="1340" y="33">implemented path</text>
  <rect x="1480" y="20" width="16" height="16" class="bypass"/>
  <text class="tiny" x="1505" y="33">bypass/default policy</text>

  <!-- Input and parser -->
  <rect class="box parser" x="50" y="110" width="480" height="420"/>
  <text class="section" x="75" y="143">PARSER FSM</text>
  <text class="small" x="75" y="168">N6 packet; no TLS payload inspection</text>
  <rect class="box" x="75" y="205" width="185" height="52" fill="#ffffff" stroke="#3976a8"/>
  <text class="label" x="167" y="228" text-anchor="middle">raw Ethernet</text>
  <text class="small" x="167" y="247" text-anchor="middle">frame at N6</text>
  <path fill="none" class="arrow" d="M260 231 H320"/>
  <polygon class="head-dark" points="310,225 320,231 310,237"/>

  <polygon class="diamond" points="375,180 455,231 375,282 295,231"/>
  <text class="small" x="375" y="226" text-anchor="middle">IPv4?</text>
  <text class="tiny" x="311" y="216">yes</text>
  <text class="tiny" x="383" y="300">no</text>
  <path fill="none" class="arrow" d="M375 282 V332"/>
  <polygon class="head-dark" points="369,322 375,332 381,322"/>
  <polygon class="diamond" points="375,332 455,383 375,434 295,383"/>
  <text class="small" x="375" y="378" text-anchor="middle">TCP?</text>
  <text class="tiny" x="311" y="368">yes</text>
  <text class="tiny" x="383" y="452">no</text>
  <path fill="none" class="arrow" d="M375 434 V482"/>
  <polygon class="head-dark" points="369,472 375,482 381,472"/>
  <text class="tiny" x="75" y="510">ethertype -> ipv4 -> tcp</text>

  <!-- Parser decision strip -->
  <rect class="node" x="575" y="110" width="1170" height="105" fill="#f8fafb" stroke="#b6c0c7" rx="10" ry="10"/>
  <text class="section" x="600" y="143">SUPPORTED-TRAFFIC GATE</text>
  <rect class="node" x="600" y="160" width="205" height="35" fill="#ffffff" stroke="#3976a8"/>
  <text class="small" x="702" y="183" text-anchor="middle">TCP dport = 443?</text>
  <path fill="none" class="arrow" d="M805 177 H850"/>
  <polygon class="head-dark" points="840,171 850,177 840,183"/>
  <rect class="node" x="850" y="160" width="205" height="35" fill="#ffffff" stroke="#3976a8"/>
  <text class="small" x="952" y="183" text-anchor="middle">TLS header valid?</text>
  <path fill="none" class="arrow" d="M1055 177 H1100"/>
  <polygon class="head-dark" points="1090,171 1100,177 1090,183"/>
  <rect class="node" x="1100" y="160" width="235" height="35" fill="#ffffff" stroke="#3976a8"/>
  <text class="small" x="1217" y="183" text-anchor="middle">TLS type = 23?</text>
  <path fill="none" class="arrow" d="M1335 177 H1380"/>
  <polygon class="head-dark" points="1370,171 1380,177 1370,183"/>
  <rect class="node" x="1380" y="160" width="325" height="35" fill="#ffffff" stroke="#37845a"/>
  <text class="small" x="1542" y="183" text-anchor="middle">extract four visible header features</text>
  <text class="tiny" x="610" y="207">negative branch: bypass/default policy; TLS handshake uses classify_t no-op/default behavior</text>

  <!-- Bypass -->
  <path fill="none" class="gray-arrow" d="M375 452 V585 H590"/>
  <polygon class="head-gray" points="580,579 590,585 580,591"/>
  <path fill="none" class="gray-arrow" d="M702 214 V585 H590"/>
  <polygon class="head-gray" points="600,579 590,585 600,591"/>
  <path fill="none" class="gray-arrow" d="M952 214 V585 H590"/>
  <polygon class="head-gray" points="600,579 590,585 600,591"/>
  <path fill="none" class="gray-arrow" d="M1217 214 V585 H590"/>
  <polygon class="head-gray" points="600,579 590,585 600,591"/>
  <rect class="box bypass" x="590" y="540" width="430" height="88"/>
  <text class="section" x="805" y="574" text-anchor="middle">BYPASS / DEFAULT POLICY</text>
  <text class="small" x="805" y="598" text-anchor="middle">No DNN inference; ordinary parsing and forwarding</text>
  <path fill="none" class="gray-arrow" d="M1020 584 H1370"/>
  <polygon class="head-gray" points="1360,578 1370,584 1360,590"/>
  <rect class="box bypass" x="1370" y="540" width="330" height="88"/>
  <text class="section" x="1535" y="574" text-anchor="middle">route/deparser</text>
  <text class="small" x="1535" y="598" text-anchor="middle">forward or drop by table</text>

  <!-- PHV and stages -->
  <path fill="none" class="arrow" d="M1705 177 V270 H560"/>
  <polygon class="head-dark" points="570,264 560,270 570,276"/>
  <rect class="box phv" x="560" y="270" width="300" height="135"/>
  <text class="section" x="710" y="301" text-anchor="middle">PHV + METADATA</text>
  <text class="small" x="710" y="332" text-anchor="middle">ipv4.len</text>
  <text class="small" x="710" y="353" text-anchor="middle">tcp.window</text>
  <text class="small" x="710" y="374" text-anchor="middle">tls.length | tls.type</text>
  <path fill="none" class="arrow" d="M860 338 H900"/>
  <polygon class="head-dark" points="890,332 900,338 890,344"/>

  <rect class="box stage" x="900" y="270" width="190" height="135"/>
  <text class="section" x="995" y="300" text-anchor="middle">STAGE 0</text>
  <text class="label" x="995" y="328" text-anchor="middle">classify_t</text>
  <text class="small" x="995" y="352" text-anchor="middle">Q16.16 DNN infer</text>
  <text class="small" x="995" y="377" text-anchor="middle">meta.class</text>
  <path fill="none" class="arrow" d="M1090 338 H1125"/>
  <polygon class="head-dark" points="1115,332 1125,338 1115,344"/>

  <rect class="box stage" x="1125" y="270" width="190" height="135"/>
  <text class="section" x="1220" y="300" text-anchor="middle">STAGE 1</text>
  <text class="label" x="1220" y="328" text-anchor="middle">qos_t</text>
  <text class="small" x="1220" y="352" text-anchor="middle">class exact match</text>
  <text class="small" x="1220" y="377" text-anchor="middle">local ipv4.tos mark</text>
  <path fill="none" class="arrow" d="M1315 338 H1350"/>
  <polygon class="head-dark" points="1340,332 1350,338 1340,344"/>

  <rect class="box stage" x="1350" y="270" width="190" height="135"/>
  <text class="section" x="1445" y="300" text-anchor="middle">STAGE 2</text>
  <text class="label" x="1445" y="328" text-anchor="middle">route</text>
  <text class="small" x="1445" y="352" text-anchor="middle">IPv4 dst LPM</text>
  <text class="small" x="1445" y="377" text-anchor="middle">egress or drop</text>
  <path fill="none" class="arrow" d="M1540 338 H1575"/>
  <polygon class="head-dark" points="1565,332 1575,338 1565,344"/>

  <rect class="box stage" x="1575" y="270" width="175" height="135"/>
  <text class="section" x="1662" y="300" text-anchor="middle">STAGE 3</text>
  <text class="label" x="1662" y="328" text-anchor="middle">mac_rewrite</text>
  <text class="small" x="1662" y="352" text-anchor="middle">egress-port match</text>
  <text class="small" x="1662" y="377" text-anchor="middle">MAC rewrite</text>
  <path fill="none" class="arrow" d="M1750 338 V445"/>
  <polygon class="head-dark" points="1744,435 1750,445 1756,435"/>
  <rect class="box" x="1575" y="445" width="175" height="62" fill="#ffffff" stroke="#37845a"/>
  <text class="label" x="1662" y="470" text-anchor="middle">deparser</text>
  <text class="small" x="1662" y="490" text-anchor="middle">forwarded output</text>

  <!-- VLIW inset -->
  <rect class="box inset" x="850" y="700" width="900" height="190"/>
  <text class="section" x="875" y="734">WITHIN EACH MATCH-ACTION STAGE</text>
  <rect class="node" x="885" y="765" width="205" height="70" fill="#ffffff" stroke="#c77b23"/>
  <text class="label" x="987" y="793" text-anchor="middle">table lookup</text>
  <text class="small" x="987" y="814" text-anchor="middle">select instruction word</text>
  <path fill="none" class="arrow" d="M1090 800 H1140"/>
  <polygon class="head-dark" points="1130,794 1140,800 1130,806"/>
  <rect class="node" x="1140" y="765" width="250" height="70" fill="#ffffff" stroke="#c77b23"/>
  <text class="label" x="1265" y="793" text-anchor="middle">Phase 1: read PHV</text>
  <text class="small" x="1265" y="814" text-anchor="middle">16 ALUs sample operands</text>
  <path fill="none" class="arrow" d="M1390 800 H1440"/>
  <polygon class="head-dark" points="1430,794 1440,800 1430,806"/>
  <rect class="node" x="1440" y="765" width="260" height="70" fill="#ffffff" stroke="#c77b23"/>
  <text class="label" x="1570" y="793" text-anchor="middle">Phase 2: write-back</text>
  <text class="small" x="1570" y="814" text-anchor="middle">commit to PHV / metadata</text>
  <text class="small" x="875" y="865">ALUs run in parallel within one stage; the four stages execute sequentially.</text>
  <text class="tiny" x="875" y="885">N3/N9 GTP-U parsing is outside the evaluated path.</text>

  <text class="tiny" x="50" y="1008">Only TLS application_data at the expected parser offset invokes the DNN. Encrypted payload bytes and decryption keys are not read.</text>
</svg>
